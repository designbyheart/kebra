services:
  db:
    image: pgvector/pgvector:pg16
    container_name: kebra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kebra
      POSTGRES_PASSWORD: kebra
      POSTGRES_DB: kebra
    ports:
      - "5433:5432"
    volumes:
      - kebra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kebra -d kebra"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kebra_pgdata:
